<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Vámonos para la yuma</title>
    <meta name="description" content="Juego incremental de Haci luchando y progresando en La Habana para cumplir su sueño de irse pa' la yuma." />
    
    <!-- Android / Chrome PWA Tags -->
    <meta name="theme-color" content="#0a2e22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Haci Yuma" />

    <!-- iOS Safari WebApp Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Haci Yuma" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="Haci: De la Soldadura a la Yuma" />
    <meta property="og:description" content="Juego incremental criollo de Haci: progresa en La Habana soldando, haciendo fletes y negocios para irte pa' la yuma." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..900;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Native App Viewport & Touch Optimization Styles -->
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #0a2e22;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior-y: none;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }
      /* Prevent bounce scroll on iOS/Android */
      #root {
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
